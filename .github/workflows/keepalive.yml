# Supabase met en pause les projets gratuits inactifs depuis 7 jours.
# Ce petit appel tous les 3 jours garde la base éveillée toute l'année.
name: Garder Supabase éveillé

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/editions?select=year&limit=1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" > /dev/null
          echo "Supabase répond ✔"

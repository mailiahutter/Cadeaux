name: Build et publication de l'APK

# La release publiée par ce workflow est exactement ce que le bouton
# « Rechercher une mise à jour » de l'application va trouver et installer.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (ex. 1.2.0), sans le v"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.test.json

      - name: Lancer les tests
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Android exige un versionCode strictement croissant d'une version à
          # l'autre. Le numéro de run du workflow le garantit sans état à tenir.
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Générer le projet Android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          UPDATE_REPO_OWNER: ${{ github.repository_owner }}
          UPDATE_REPO_NAME: ${{ github.event.repository.name }}
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est absent. Sans clé stable, "\
                 "Android refusera d'installer la mise à jour par-dessus la version "\
                 "précédente. Voir docs/SIGNATURE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Construire l'APK signée
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PKARAKEEP_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PKARAKEEP_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKARAKEEP_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKARAKEEP_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Vérifier la signature
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          # Une APK signée avec la clé de debug s'installerait, mais ne pourrait
          # jamais être mise à jour par une version signée correctement.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::L'APK est signée avec la clé de debug."
            exit 1
          fi

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp "$APK" "dist/karakeep-local-${{ steps.version.outputs.tag }}.apk"
          ls -lh dist/

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
